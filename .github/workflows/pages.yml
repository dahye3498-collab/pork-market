name: Collect prices and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      days:
        description: Number of days to refresh (1–90; blank uses default)
        required: false
        default: ''
  schedule:
    - cron: '10 1,9 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - name: Collect official daily data
        run: node scripts/collect-pages.mjs
        env:
          EKAPE_API_KEY: ${{ secrets.EKAPE_API_KEY }}
          COLLECT_DAYS: ${{ inputs.days }}
      - name: Save history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pork-records.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official pork auction data'
            git push
          fi
      - run: node scripts/build-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
